<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333; }
    .header { background-color: #dc2626; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
    .content { padding: 20px; border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 8px 8px; }
    .detail { margin: 10px 0; padding: 8px; background-color: #fef2f2; border-radius: 4px; }
    .label { font-weight: bold; color: #dc2626; }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Appointment Cancelled</h1>
  </div>
  <div class="content">
    <p>Hi {{customerName}},</p>
    <p>Your appointment has been cancelled. Here are the details:</p>
    <div class="detail">
      <p><span class="label">Service:</span> {{serviceName}}</p>
      <p><span class="label">Date:</span> {{date}}</p>
      <p><span class="label">Time:</span> {{startTime}} - {{endTime}}</p>
    </div>
    <p>We hope to see you again soon!</p>
  </div>
  <div class="footer">
    <p>Kairos Schedule — Appointment Booking System</p>
  </div>
</body>
</html>
